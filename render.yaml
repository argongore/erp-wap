services:
  - type: web
    name: erp-wijaya-agro
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Jakarta
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
